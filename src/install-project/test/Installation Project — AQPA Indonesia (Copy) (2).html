<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Installation Project — AQPA Indonesia (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>

:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
:root{
--bg:#eef1f3;--panel:#ffffff;--ink:#16222b;--muted:#5c6b76;--line:#d4dde1;--soft:#e4ebee;
--accent:#1f3864;--accent-ink:#ffffff;--heat:#c8860d;--heat-soft:#f3e3c3;
--ok:#2c8445;--ok-soft:#dcefe1;--warn:#a86f12;--warn-soft:#f3e6cc;--bad:#c22f2f;--bad-soft:#fbdede;
--f-disp:'Oswald','Arial Narrow',Arial,sans-serif;
--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0e1419;--panel:#161f26;--ink:#e4ebef;--muted:#90a0aa;--line:#2a373f;--soft:#1c2730;
--accent:#5b86c9;--accent-ink:#0b1420;--heat:#e0a847;--heat-soft:#3a2d15;
--ok:#5ec27a;--ok-soft:#163222;--warn:#e1a947;--warn-soft:#3a2d15;--bad:#ff6d6d;--bad-soft:#3a1c1c;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0e1419;--panel:#161f26;--ink:#e4ebef;--muted:#90a0aa;--line:#2a373f;--soft:#1c2730;
--accent:#5b86c9;--accent-ink:#0b1420;--heat:#e0a847;--heat-soft:#3a2d15;
--ok:#5ec27a;--ok-soft:#163222;--warn:#e1a947;--warn-soft:#3a2d15;--bad:#ff6d6d;--bad-soft:#3a1c1c;
color-scheme:dark}

.wrap{padding-inline:16px;padding-block:0 48px;max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px;border-bottom:2px solid var(--ink)}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.brand h1{margin:2px 0 0;font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1.05}
.brand h1 span{color:var(--heat)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-block:10px 18px;border-bottom:1px solid var(--line)}
nav.tabs button{font-family:var(--f-disp);font-size:15px;font-weight:600;letter-spacing:.03em;background:none;border:0;color:var(--muted);padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--heat)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:.01em}
h2{font-size:19px;font-weight:700}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number],input[type=date]{font-family:var(--f-mono);font-size:13px}
input[type=checkbox]{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--panel)}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-size:clamp(19px,1.6vw,24px);font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.kpi.hot .v{color:var(--heat)}.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.bad{color:var(--bad);background:var(--bad-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}.pill.info{color:var(--accent)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12px}
tr.tot td{background:var(--soft);font-weight:600}
tr.gt td{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tbl-edit input,.tbl-edit select{padding:4px 6px;font-size:12.5px}
.tbl-edit td{padding:4px 6px}
.note{font-size:12px;color:var(--muted)}
.warnbox{border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:8px 11px;font-size:12.5px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:10.5px var(--f-mono)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .axis{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.acc{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:10px}
.acc>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);font-family:var(--f-disp);font-weight:600;font-size:14.5px}
.acc>summary::-webkit-details-marker{display:none}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc .body{padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 8px;font-size:12px;background:var(--panel);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.pctbox{display:inline-flex;align-items:center;gap:4px}
.pctbox input{width:84px}
.pctbox>span{color:var(--muted);font-size:12px}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ok>i{background:var(--ok)}
.capcell{display:flex;align-items:center;gap:8px;min-width:150px}
.capcell b{font-family:var(--f-mono);font-size:12.5px;min-width:52px;text-align:right}
.ubox{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:8px;background:var(--bg)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;font:600 10.5px var(--f-mono);padding:0 6px;border-radius:4px;border:1px solid var(--heat);color:var(--heat);background:var(--heat-soft);white-space:nowrap}
.d-add{color:var(--ok);font-weight:600}.d-del{color:var(--bad);font-weight:600}.d-chg{color:var(--warn);font-weight:600}
.sect{font-family:var(--f-disp);font-size:13px;letter-spacing:.08em;color:var(--heat);margin:8px 0 -6px;font-weight:600}
details.ver{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel)}
details.ver>summary{cursor:pointer;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
details.ver .vb{padding:0 10px 10px}

.ctx{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--heat);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.ctx select{font-weight:600}
</style></head>
<body>
<div id="app"></div>
<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const fmtRp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const fmtPct=(n,d=1)=>((n||0)*100).toFixed(d)+'%';
const fmtPctS=n=>(+(((n||0)*100).toFixed(2)))+'%';
const pctVal=w=>+(((+w||0)*100).toFixed(4));
const fmtNum=(n,d=0)=>(n||0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtTs=ts=>{try{return new Date(ts).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ts}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addDaysStr(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function daysBetweenInclusive(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
function dateRange(a,b){const out=[];if(!a||!b||a>b)return out;let d=a,g=0;while(d<=b&&g<400){out.push(d);d=addDaysStr(d,1);g++}return out}
let toastT;
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',3000)}

/* ============ state ============ */
const DB_KEY='aqpa_installation_project_db_v1';
const OLD_KEYS=['aqpa_installation_project_v4','aqpa_installation_project_v3','aqpa_installation_project_v2'];
const STATUS_LABEL={registered:'Registered',running:'Running',closed:'Closed'};
const PORTFOLIO=['register','sumPlan','sumRunning','sumClosed'];
const DEFAULT_SCOPES=['Mobilisasi Alat & Material','Marking & Layout','Fabrikasi Support / Bracket','Instalasi Metal Expansion Joint',
 'Pengelasan (Welding)','Pemasangan Anchor / Bolting','Alignment & Leveling','Pressure / Leak Test','Painting & Coating',
 'Inspection & Final Check','Cleaning & Demobilisasi'];
const POSISI=['Leader','Welder','Teknisi','Helper','HSE'];
const KATEGORI=['Akomodasi','Hotel','Transportasi','Consumable'];
let uid=1;
function nid(){return uid++}
function projTarget(){return addDaysStr(S.meta.start,(S.meta.durationDays||1)-1)}

function defaultState(){
 const mp=(name,posisi,rh)=>({id:nid(),name,posisi,rateHour:rh});
 const manpower=[
  mp('Nama Manpower 1','Welder',45000), mp('Nama Manpower 2','Welder',45000),
  mp('Nama Manpower 3','Teknisi',40000), mp('Nama Manpower 4','Teknisi',40000),
  mp('Nama Manpower 5','Helper',32500), mp('Nama Manpower 6','Helper',32500)];
 const grp=name=>({id:nid(),name});
 const groups=[grp('Tim Welding A'),grp('Tim Mekanikal B'),grp('Tim Gabungan')];
 const roster=[
  {id:nid(),groupId:groups[0].id,date:'2026-09-01',members:[manpower[0].id,manpower[1].id,manpower[2].id]},
  {id:nid(),groupId:groups[1].id,date:'2026-09-01',members:[manpower[3].id,manpower[4].id]},
  {id:nid(),groupId:groups[2].id,date:'2026-09-01',members:manpower.map(m=>m.id)}];
 const areas=[{id:nid(),name:'Area 1',weight:.55},{id:nid(),name:'Area 2',weight:.45}];
 const mkUnit=(areaId,name,weight,groupId,start,finish)=>({id:nid(),areaId,name,weight,groupId,start,finish});
 const units=[
  mkUnit(areas[0].id,'Unit 1',.60,groups[0].id,'2026-09-01','2026-09-20'),
  mkUnit(areas[0].id,'Unit 2',.40,groups[1].id,'2026-09-08','2026-09-27'),
  mkUnit(areas[1].id,'Unit 1',.50,groups[2].id,'2026-09-01','2026-09-20'),
  mkUnit(areas[1].id,'Unit 2',.50,groups[0].id,'2026-09-08','2026-09-27')];
 const mkItem=(unitId,scope,weight)=>({id:nid(),unitId,scope,weight,tipe:'planned'});
 const items=[
  mkItem(units[0].id,'Mobilisasi Alat & Material',.08), mkItem(units[0].id,'Marking & Layout',.12),
  mkItem(units[0].id,'Instalasi Metal Expansion Joint',.40), mkItem(units[0].id,'Pengelasan (Welding)',.28),
  mkItem(units[0].id,'Inspection & Final Check',.12),
  mkItem(units[1].id,'Mobilisasi Alat & Material',.10), mkItem(units[1].id,'Instalasi Metal Expansion Joint',.50),
  mkItem(units[1].id,'Pressure / Leak Test',.25), mkItem(units[1].id,'Inspection & Final Check',.15),
  mkItem(units[2].id,'Mobilisasi Alat & Material',.08), mkItem(units[2].id,'Marking & Layout',.12),
  mkItem(units[2].id,'Instalasi Metal Expansion Joint',.40), mkItem(units[2].id,'Pengelasan (Welding)',.28),
  mkItem(units[2].id,'Inspection & Final Check',.12),
  mkItem(units[3].id,'Mobilisasi Alat & Material',.05), mkItem(units[3].id,'Marking & Layout',.10),
  mkItem(units[3].id,'Instalasi Metal Expansion Joint',.35), mkItem(units[3].id,'Pengelasan (Welding)',.20),
  mkItem(units[3].id,'Painting & Coating',.15), mkItem(units[3].id,'Inspection & Final Check',.15)];
 const logs=[
  {id:nid(),date:'2026-09-01',itemId:items[0].id,pct:1},
  {id:nid(),date:'2026-09-02',itemId:items[1].id,pct:.6},
  {id:nid(),date:'2026-09-03',itemId:items[1].id,pct:.4},
  {id:nid(),date:'2026-09-08',itemId:items[5].id,pct:1}];
 const hours=[
  {id:nid(),date:'2026-09-01',unitId:units[0].id,hours:8},
  {id:nid(),date:'2026-09-02',unitId:units[0].id,hours:7},
  {id:nid(),date:'2026-09-03',unitId:units[0].id,hours:6},
  {id:nid(),date:'2026-09-08',unitId:units[1].id,hours:8}];
 const costs=[
  {id:nid(),date:'2026-09-01',kategori:'Akomodasi',ket:'Mess / penginapan tim',amount:2000000,alloc:'prorata'},
  {id:nid(),date:'2026-09-01',kategori:'Hotel',ket:'Hotel supervisor',amount:3500000,alloc:'prorata'},
  {id:nid(),date:'2026-09-05',kategori:'Transportasi',ket:'Mobilisasi tim & BBM',amount:1500000,alloc:'prorata'},
  {id:nid(),date:'2026-09-01',kategori:'Consumable',ket:'Elektroda & gas las',amount:480000,alloc:units[0].id}];
 return {
  tab:'dash',
  meta:{customer:'PT Nama Customer',leader:'Nama Leader',start:'2026-09-01',durationDays:76,company:'AQPA Indonesia'},
  scopeCatalog:DEFAULT_SCOPES.slice(),
  manpower,groups,roster,areas,units,items,logs,hours,costs,
  versions:{master:[],rencana:[]},reports:[],savedAt:{},
  uid
 };
}
function maxIdOf(o){let m=0;['manpower','groups','roster','areas','units','items','logs','hours','costs','reports'].forEach(k=>(o[k]||[]).forEach(x=>{if(x&&x.id>m)m=x.id}));
 ['master','rencana'].forEach(k=>((o.versions||{})[k]||[]).forEach(x=>{if(x&&x.id>m)m=x.id}));return m}
function normalizeState(o){
 if(!o||!o.manpower||!o.areas||!o.units||!o.items)return null;
 o.groups=o.groups||[];o.roster=o.roster||[];o.scopeCatalog=o.scopeCatalog||[];o.costs=o.costs||[];o.logs=o.logs||[];
 o.meta=o.meta||{};
 if(!o.hours){ // migrasi dari versi lama: jam & consumable tersimpan di tiap log
  let n=Math.max(o.uid||1,maxIdOf(o)+1);
  const hmap={};
  o.logs.forEach(l=>{
   const it=o.items.find(x=>x.id===l.itemId);if(!it)return;
   if(+l.hours>0){const k=l.date+'|'+it.unitId;hmap[k]=(hmap[k]||0)+(+l.hours)}
   if(+l.consumable>0)o.costs.push({id:n++,date:l.date,kategori:'Consumable',ket:'migrasi dari data lama',amount:+l.consumable,alloc:it.unitId});
  });
  o.hours=Object.keys(hmap).map(k=>{const[d,u]=k.split('|');return{id:n++,date:d,unitId:+u,hours:hmap[k]}});
  o.logs=o.logs.map(l=>({id:l.id,date:l.date,itemId:l.itemId,pct:l.pct}));
  o.uid=n;
 }
 const tgt=o.meta.start?addDaysStr(o.meta.start,(o.meta.durationDays||1)-1):'';
 o.units.forEach(u=>{ // target start/finish per unit (turunan dari tanggal scope lama bila belum ada)
  if(!u.start||!u.finish){
   const its=o.items.filter(i=>i.unitId===u.id&&i.start&&i.finish);
   if(!u.start)u.start=its.length?its.map(i=>i.start).sort()[0]:(o.meta.start||'');
   if(!u.finish)u.finish=its.length?its.map(i=>i.finish).sort().slice(-1)[0]:tgt;
  }
  if(u.groupId==null)u.groupId=0;
 });
 o.items.forEach(i=>{if(!i.tipe)i.tipe='planned'});
 o.versions=o.versions||{master:[],rencana:[]};o.versions.master=o.versions.master||[];o.versions.rencana=o.versions.rencana||[];
 o.reports=o.reports||[];o.savedAt=o.savedAt||{};
 o.uid=Math.max(o.uid||1,maxIdOf(o)+1);
 if(!o.tab||o.tab==='struktur')o.tab=o.tab==='struktur'?'rencana':'dash';
 return o;
}

/* ---------- portfolio (banyak project) ---------- */
function maxIdAll(db){let m=0;db.projects.forEach(p=>{m=Math.max(m,p.id||0,maxIdOf(p.data))});((db.versions||{}).register||[]).forEach(x=>{if(x.id>m)m=x.id});(db.summaries||[]).forEach(x=>{if(x.id>m)m=x.id});return m}
const newReg=o=>Object.assign({no:'',nama:'',lokasi:'',kontrak:0,budget:0,status:'registered',catatan:'',startedAt:'',closedAt:''},o||{});
function wrapLegacy(data){
 const d=normalizeState(data);if(!d)return null;
 uid=Math.max(uid,d.uid||1);
 const dts=[...d.logs.map(l=>l.date),...d.hours.map(h=>h.date)].sort();
 return{id:nid(),reg:newReg({no:'PRJ-001',nama:d.meta.customer?('Project '+d.meta.customer):'Project 1',status:dts.length?'running':'registered',startedAt:dts.length?dts[0]:''}),data:d};
}
function normalizeDB(db){
 if(!db||!Array.isArray(db.projects))return null;
 db.projects=db.projects.filter(p=>p&&p.data&&normalizeState(p.data));
 if(!db.projects.length)return null;
 db.projects.forEach(p=>{p.reg=newReg(p.reg)});
 db.versions=db.versions||{};db.versions.register=db.versions.register||[];
 db.summaries=db.summaries||[];db.savedAt=db.savedAt||{};
 uid=Math.max(uid,db.uid||1,maxIdAll(db)+1);db.uid=uid;
 db.projects.forEach(p=>{if(!p.id)p.id=nid()});
 if(!db.projects.some(p=>p.id===db.activeId))db.activeId=db.projects[0].id;
 return db;
}
function cloneMaster(src,start){
 const c=JSON.parse(JSON.stringify({scopeCatalog:src.scopeCatalog,manpower:src.manpower,groups:src.groups,roster:src.roster}));
 c.roster.forEach(r=>r.date=start);return c;
}
function blankProject(meta,src,copy){
 const base=(copy&&src)?cloneMaster(src,meta.start):{scopeCatalog:DEFAULT_SCOPES.slice(),manpower:[],groups:[],roster:[]};
 return Object.assign({tab:'dash',meta:Object.assign({company:'AQPA Indonesia'},meta)},base,
  {areas:[],units:[],items:[],logs:[],hours:[],costs:[],versions:{master:[],rencana:[]},reports:[],savedAt:{},uid:1});
}
function miniProject(meta,src,plan,withLogs){
 const d=blankProject(meta,src,true),specs=[];
 plan.forEach(a=>{

 [0,.25,.5,.75,1].forEach(v=>{const yy=y(v);grid+=`<line class="grid" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/><text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end">${Math.round(v*100)}%</text>`});

 const bump=(c,len)=>{widths[c]=Math.max(widths[c]||8,Math.min(60,len+2))};
 const addRow=cells=>{
  r++;
  const xml=cells.map((c,i)=>{
   if(c==null)return '';const ref=colLetter(i)+r;
   if(c.n)return `<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`;
   if(c.v==='')return `<c r="${ref}" s="${c.s}"/>`;
   return `<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
  }).join('');
  rows.push(xml?`<row r="${r}">${xml}</row>`:`<row r="${r}"/>`);
 };
 addRow([{v:model.title,s:XS.title}]);
 addRow([{v:model.subtitle||'',s:XS.sub}]);
 addRow([]);
 blocks.forEach(b=>{
  if(b.t==='h'){addRow([{v:b.text,s:XS.sec}]);}
  else if(b.t==='p'){addRow([{v:b.text,s:XS.note}]);}
  else if(b.t==='table'){
   b.head.forEach((h,i)=>bump(i,String(h).length));
   addRow(b.head.map(h=>({v:String(h),s:XS.head})));
   b.rows.forEach((row,ri)=>{
    const bold=(b.tot||[]).includes(ri);
    addRow(row.map((v,i)=>{const f=(b.fmt||[])[i];bump(i,cellText(v,f).length);return xcell(v,f,bold)}));
   });
   addRow([]);
  }
 });
 const cols=widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols?`<cols>${cols}</cols>`:''}<sheetData>${rows.join('')}</sheetData></worksheet>`;
}

const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
 667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
 556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WINMAP={0x2013:0x96,0x2014:0x97,0x2022:0x95,0x2026:0x85,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94};
function toWin(str){
 let o='';
 for(const ch of String(str)){
  const c=ch.codePointAt(0);
  if(c===0x2192){o+='->';continue}if(c===0x2265){o+='>=';continue}if(c===0x2264){o+='<=';continue}if(c===0x2715){o+='x';continue}
  if(WINMAP[c]){o+=String.fromCharCode(WINMAP[c]);continue}
  if(c<32){o+=' ';continue}if(c>255){o+='?';continue}
  o+=ch;
 }
 return o;
}
function cw(code){if(code>=32&&code<=126)return HW[code-32];if(code===0x96)return 556;if(code===0x97)return 1000;if(code===0x95)return 350;if(code===0x85)return 1000;return 556}
function tw(s,size,bold){let w=0;for(let i=0;i<s.length;i++)w+=cw(s.charCodeAt(i));return w*size/1000*(bold?1.07:1)}
const pdfLit=s=>'('+s.replace(/[\\()]/g,m=>'\\'+m)+')';
function wrapText(s,maxW,size,bold){
 const lines=[];
 String(s).split('\n').forEach(par=>{
  const words=toWin(par).split(' ');let cur='';
  const push=()=>{lines.push(cur);cur=''};
  words.forEach(w=>{
   while(tw(w,size,bold)>maxW&&w.length>1){ // pecah kata yang terlalu panjang
    let k=w.length;while(k>1&&tw(w.slice(0,k),size,bold)>maxW)k--;
    if(cur)push();lines.push(w.slice(0,k));w=w.slice(k);
   }
   const t=cur?cur+' '+w:w;
   if(tw(t,size,bold)<=maxW)cur=t;else{if(cur)push();cur=w}
  });
  lines.push(cur);
 });
 return lines;
}
function buildPdf(model){
 const PW=842,PH=595,M=34,FOOT=26;
 const NAVY=[.122,.22,.392],GREYF=[.95,.96,.97],TOTF=[.89,.92,.93],LINE=[.82,.86,.88],INK=[.09,.13,.17],MUTED=[.36,.42,.46],WHITE=[1,1,1],HEAT=[.75,.52,.04];
 const pages=[];let ops=null,y=0;
 const col=c=>c.map(v=>v.toFixed(3)).join(' ');
 const newPage=()=>{ops=[];pages.push(ops);y=M};
 const rect=(x,top,w,h,fill)=>ops.push(`${col(fill)} rg ${x.toFixed(2)} ${(PH-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
 const hline=(x1,x2,yy,c)=>ops.push(`${col(c)} RG 0.5 w ${x1.toFixed(2)} ${(PH-yy).toFixed(2)} m ${x2.toFixed(2)} ${(PH-yy).toFixed(2)} l S`);
 const text=(x,base,s,size,bold,c)=>ops.push(`BT ${col(c)} rg /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${(PH-base).toFixed(2)} Td ${pdfLit(s)} Tj ET`);
 const need=h=>{if(y+h>PH-M-FOOT){newPage();return true}return false};
 newPage();
 text(M,y+8,toWin('AQPA INDONESIA  -  INSTALLATION PROJECT'),8,true,HEAT);y+=22;
 text(M,y+12,toWin(model.title),17,true,NAVY);y+=24;
 if(model.subtitle){wrapText(model.subtitle,PW-2*M,8.5,false).forEach(l=>{text(M,y+8,l,8.5,false,MUTED);y+=11});}
 y+=6;
 model.sheets.forEach((sh,si)=>{
  if(si>0&&y>PH-M-FOOT-70)newPage();
  need(30);
  rect(M,y,PW-2*M,18,NAVY);text(M+8,y+12.5,toWin(sh.name),10.5,true,WHITE);y+=26;
  sh.blocks.forEach(b=>{
   if(b.t==='h'){need(24);text(M,y+10,toWin(b.text),10.5,true,NAVY);y+=18}
   else if(b.t==='p'){wrapText(b.text,PW-2*M,8.5,false).forEach(l=>{need(12);text(M,y+9,l,8.5,false,MUTED);y+=11.5});y+=4}
   else if(b.t==='table'){
    const pad=4,n=b.head.length,avail=PW-2*M,F=b.fmt||[];
    const disp=b.rows.map(r=>r.map((v,i)=>toWin(cellText(v,F[i]))));
    const hd=b.head.map(h=>toWin(h));
    const longestWord=(str,sz,bd)=>Math.max(0,...String(str).split(/\s+/).map(w=>tw(w,sz,bd)));
    let fs=8,nat,mins;
    for(const f of [8,7.4,6.8,6.2,5.6]){
     fs=f;
     nat=hd.map((h,i)=>{let m=tw(h,fs,true);disp.forEach((r,ri)=>{m=Math.max(m,tw(r[i]||'',fs,(b.tot||[]).includes(ri)))});return clamp(m+2*pad+2,34,260)});
     mins=hd.map((h,i)=>{
      if(isNumFmt(F[i]))return nat[i]; // angka tidak boleh dipecah
      let m=longestWord(h,fs,true);disp.forEach(r=>{m=Math.max(m,Math.min(longestWord(r[i]||'',fs,false),70))});
      return Math.min(nat[i],Math.max(34,m+2*pad+2));
     });
     if(mins.reduce((x,y)=>x+y,0)<=avail)break;
    }
    const lead=fs+2.4;
    let sum=nat.reduce((x,y)=>x+y,0);
    if(sum>avail){
     // susutkan hanya kolom yang masih punya ruang (nat>min), proporsional
     const slack=nat.map((w,i)=>w-mins[i]),totSlack=slack.reduce((x,y)=>x+y,0),need=sum-avail;
     nat=nat.map((w,i)=>totSlack>0?w-slack[i]*Math.min(1,need/totSlack):w);
     sum=nat.reduce((x,y)=>x+y,0);
     if(sum>avail){const k=avail/sum;nat=nat.map(w=>w*k);sum=avail}
    }
    const xs=[];let acc=M;nat.forEach(w=>{xs.push(acc);acc+=w});
    const headLines=hd.map((h,i)=>wrapText(h,nat[i]-2*pad,fs,true));
    const drawRow=(cells,isHead,zebra,isTot)=>{
     const lines=cells.map((c,i)=>wrapText(c,nat[i]-2*pad,fs,isHead||isTot));
     const rh=Math.max(...lines.map(l=>l.length))*lead+6;
     return{lines,rh};
    };
    const hr=drawRow(hd,true);
    const paintHead=()=>{
     rect(M,y,sum,hr.rh,NAVY);
     hr.lines.forEach((ls,i)=>{ls.forEach((l,k)=>{const x=(isNumFmt((b.fmt||[])[i]))?xs[i]+nat[i]-pad-tw(l,fs,true):xs[i]+pad;text(x,y+3+fs+k*lead,l,fs,true,WHITE)})});
     y+=hr.rh;
    };
    need(hr.rh+30);paintHead();
    disp.forEach((row,ri)=>{
     const isTot=(b.tot||[]).includes(ri);
     const rr=drawRow(row,false,false,isTot);
     if(y+rr.rh>PH-M-FOOT){newPage();paintHead()}
     if(isTot)rect(M,y,sum,rr.rh,TOTF);else if(ri%2===1)rect(M,y,sum,rr.rh,GREYF);
     rr.lines.forEach((ls,i)=>{ls.forEach((l,k)=>{const f=(b.fmt||[])[i];const x=isNumFmt(f)?xs[i]+nat[i]-pad-tw(l,fs,isTot):xs[i]+pad;text(x,y+3+fs+k*lead,l,fs,isTot,INK)})});
     y+=rr.rh;hline(M,M+sum,y,LINE);
    });
    y+=10;
   }
  });
  y+=4;
 });
 const total=pages.length;
 pages.forEach((p,i)=>{
  ops=p;
  hline(M,PW-M,PH-M-FOOT+8,LINE);
  text(M,PH-M-FOOT+20,toWin('Installation Project - AQPA Indonesia'),7.5,false,MUTED);
  const s=toWin(`Dicetak ${fmtTs(new Date().toISOString())}   |   Halaman ${i+1} / ${total}`);
  text(PW-M-tw(s,7.5,false),PH-M-FOOT+20,s,7.5,false,MUTED);
 });
 const objs=[];
 objs.push('<< /Type /Catalog /Pages 2 0 R >>');
 objs.push(`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+2*i} 0 R`).join(' ')}] /Count ${total} >>`);
 objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 pages.forEach((p,i)=>{
  const content=p.join('\n');
  objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`);
  objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
 });
 let out='%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n';const offs=[];
 objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
 const xref=out.length;
 out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
 out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
 return bytes;
}

function versionsSheet(kind){

/* ============ Report manpower ============ */
function reportCompute(from,to){
 const inR=d=>(!from||d>=from)&&(!to||d<=to);
 const per={};S.manpower.forEach(m=>per[m.id]={mp:m,dates:new Set(),hours:0,units:{}});
 const day={};const noGroup=new Set();
 S.hours.forEach(h=>{
  if(!inR(h.date))return;const u=unitById(h.unitId);if(!u)return;const hrs=+h.hours||0;if(hrs<=0)return;
  const mem=groupMembersAt(u.groupId,h.date);if(!mem.length)noGroup.add(u.id);
  (day[h.date]=day[h.date]||{units:{},heads:new Set(),total:0});
  day[h.date].units[u.id]=(day[h.date].units[u.id]||0)+hrs*mem.length;day[h.date].total+=hrs*mem.length;
  mem.forEach(mid=>{
   const p=per[mid];if(!p)return;
   p.dates.add(h.date);p.hours+=hrs;p.units[u.id]=(p.units[u.id]||0)+hrs;day[h.date].heads.add(mid);
  });
 });
 return{per,day,noGroup};
}
function reportModel(from,to){
 const R=reportCompute(from,to),today=todayStr();
 const M=mHead('Report Manpower','Report-Manpower');
 const per=`Periode: ${from||'awal proyek'} s.d. ${to||'saat ini'}`;
 M.subtitle+=`  |  ${per}`;
 const units=S.units.slice().sort((a,b)=>unitLabel(a).localeCompare(unitLabel(b)));
 const mpList=Object.values(R.per);
 const r1=mpList.map((p,i)=>{
  const ds=[...p.dates].sort();
  const worked=ds.length>0;
  const uList=Object.keys(p.units).map(id=>({u:unitById(+id),h:p.units[id]})).sort((a,b)=>b.h-a.h).map(x=>`${unitLabel(x.u)} (${fmtNum(x.h,1)} jam)`).join('; ');
  const status=!worked?'Belum bekerja':(manpowerCurrentGroup(p.mp.id,today)?'Aktif':'Selesai');
  return[i+1,p.mp.name,p.mp.posisi,worked?ds[0]:'-',worked?ds[ds.length-1]:'-',ds.length,p.hours,status,uList||'-'];
 });
 const r2=mpList.map(p=>[p.mp.name,p.mp.posisi,...units.map(u=>p.units[u.id]||null),p.hours]);
 const tot2=['TOTAL','',...units.map(u=>mpList.reduce((s,p)=>s+(p.units[u.id]||0),0)||null),mpList.reduce((s,p)=>s+p.hours,0)];
 const dates=Object.keys(R.day).sort();
 const r3=dates.map(d=>[d,...units.map(u=>R.day[d].units[u.id]||null),R.day[d].total,R.day[d].heads.size]);
 const tot3=['TOTAL',...units.map(u=>dates.reduce((s,d)=>s+(R.day[d].units[u.id]||0),0)||null),dates.reduce((s,d)=>s+R.day[d].total,0),''];
 const warn=[...R.noGroup].map(id=>unitLabel(unitById(id)));
 const nb=warn.length?[{t:'p',text:'Perhatian: unit berikut memiliki jam kerja tetapi belum ada group/anggota pada tanggal tsb, sehingga man-hour = 0: '+warn.join(', ')}]:[];
 const uh=units.map(u=>unitLabel(u));
 M.sheets=[
  {name:'Join - Selesai',blocks:[{t:'p',text:`${per}. Mulai Join = tanggal pertama manpower bekerja (jam kerja tercatat); Selesai = tanggal terakhir bekerja. Status Aktif bila masih tergabung dalam suatu group hari ini.`},
   {t:'table',head:['No','Nama Manpower','Posisi','Tanggal Mulai Join','Tanggal Selesai','Hari Kerja','Total Jam','Status','Area - Unit yang Dikerjakan'],fmt:['int','text','text','date','date','int','dec1','text','text'],rows:r1}]},
  {name:'Manpower per Unit',blocks:[{t:'p',text:`${per}. Jam kerja tiap manpower pada setiap Area - Unit.`},...nb,
   {t:'table',head:['Nama Manpower','Posisi',...uh,'Total Jam'],fmt:['text','text',...uh.map(()=>'dec1'),'dec1'],rows:[...r2,tot2],tot:[r2.length]}]},
  {name:'Man-Hour Harian',blocks:[{t:'p',text:`${per}. Man-Hour = jam kerja x jumlah anggota group pada hari tsb, per hari dan per unit.`},
   {t:'table',head:['Tanggal',...uh,'Total Man-Hours','Manpower Hadir'],fmt:['date',...uh.map(()=>'dec1'),'dec1','int'],rows:[...r3,tot3],tot:[r3.length]}]}];
 return M;
}

/* ============ view: daily input ============ */
function prevCum(itemId,date){return Math.min(1,S.logs.filter(l=>l.itemId===itemId&&l.date<date).reduce((s,l)=>s+(+l.pct||0),0))}
function dailyLoad(){
 const D=UI.daily;D.pcts={};
 itemsOf(D.unitId).forEach(it=>{const l=S.logs.find(l=>l.date===D.date&&l.itemId===it.id);if(l)D.pcts[it.id]=pctVal(l.pct)});
 const h=S.hours.find(h=>h.date===D.date&&h.unitId===D.unitId);
 D.hours=h?h.hours:8;
}
function dailyEnsure(){
 const D=UI.daily;
 if(!D.date)D.date=todayStr();
 if(!areaById(D.areaId))D.areaId=S.areas[0]?S.areas[0].id:null;
 const u=unitById(D.unitId);
 if(!u||u.areaId!==D.areaId){const us=unitsOf(D.areaId);D.unitId=us[0]?us[0].id:null}
 const key=D.date+'|'+D.unitId;
 if(D.loadedKey!==key){dailyLoad();D.loadedKey=key}
}
function dailyRowCalc(it){
 const D=UI.daily,prev=prevCum(it.id,D.date),v=parseFloat(D.pcts[it.id]);
 const inc=isNaN(v)||v<=0?0:Math.min(v/100,Math.max(0,1-prev));
 return{prev,inc,total:prev+inc};
}
function updateDailyPreview(){
 const D=UI.daily,items=plannedItemsOf(D.unitId);let wsum=0,acc=0;
 itemsOf(D.unitId).forEach(it=>{
  const c=dailyRowCalc(it);
  if(it.tipe!=='additional'){wsum+=+it.weight||0;acc+=(+it.weight||0)*c.total}
  const t=document.getElementById('pv_'+it.id),b=document.getElementById('pvb_'+it.id);
  if(t)t.textContent=fmtPctS(c.total);if(b)b.style.width=Math.min(100,c.total*100)+'%';
 });
 const u=document.getElementById('pvu');if(u)u.textContent=fmtPctS(wsum>0?acc/wsum:0);
}
function viewDaily(){
 dailyEnsure();const D=UI.daily;
 const areaOpts=S.areas.map(a=>`<option value="${a.id}" ${a.id===D.areaId?'selected':''}>${esc(a.name)}</option>`).join('');
 const unitOpts=unitsOf(D.areaId).map(u=>`<option value="${u.id}" ${u.id===D.unitId?'selected':''}>${esc(u.name)}</option>`).join('');
 const unit=unitById(D.unitId),items=unit?itemsOf(unit.id):[];
 const g=unit?groupById(unit.groupId):null;
 const members=unit?groupMembersAt(unit.groupId,D.date):[];
 let wsum=0,acc=0;
 const planned=items.filter(i=>i.tipe!=='additional'),extra=items.filter(i=>i.tipe==='additional');
 const rowHtml=it=>{
  const c=dailyRowCalc(it),add=it.tipe==='additional';
  if(!add){wsum+=+it.weight||0;acc+=(+it.weight||0)*c.total}
  const val=D.pcts[it.id];
  return `<tr>
   <td>${esc(it.scope)} ${add?'<span class="badge">Additional Job</span>':''}</td>
   <td class="n">${add?'–':fmtPctS(it.weight)}</td>
   <td class="n">${fmtPctS(c.prev)}</td>
   <td class="n"><span class="pctbox"><input type="number" min="0" max="100" step="any" placeholder="0" data-ui="daily.pcts.${it.id}" value="${val==null?'':esc(val)}"><span>%</span></span></td>
   <td><div class="capcell"><div class="bar" style="flex:1"><i id="pvb_${it.id}" style="width:${Math.min(100,c.total*100)}%"></i></div><b id="pv_${it.id}">${fmtPctS(c.total)}</b></div></td>
  </tr>`;
 };
 const rows=planned.map(rowHtml).join('')+extra.map(rowHtml).join('');
 const plannedW=sumWeight(planned);

 const keys={};
 S.logs.forEach(l=>{const it=itemById(l.itemId);if(!it)return;const k=l.date+'|'+it.unitId;(keys[k]=keys[k]||{date:l.date,unitId:it.unitId,items:[],hours:0}).items.push({scope:it.scope,pct:l.pct,add:it.tipe==='additional'})});
 S.hours.forEach(h=>{const k=h.date+'|'+h.unitId;(keys[k]=keys[k]||{date:h.date,unitId:h.unitId,items:[],hours:0}).hours+=+h.hours||0});
 const hist=Object.values(keys).sort((a,b)=>b.date.localeCompare(a.date)||a.unitId-b.unitId).map(e=>{
  const u=unitById(e.unitId);
  const chips=e.items.map(x=>`<span class="pill ${x.add?'warn':'info'}" style="margin:1px 3px 1px 0">${esc(x.scope)}${x.add?' (Additional)':''} +${fmtPctS(x.pct)}</span>`).join('')||'<span class="note">–</span>';
  return `<tr><td class="mono">${e.date}</td><td>${esc(unitLabel(u))}</td><td class="n">${fmtNum(e.hours,1)}</td><td>${chips}</td>
   <td style="white-space:nowrap"><button class="btn sm" data-a="editDay" data-date="${e.date}" data-unit="${e.unitId}">Edit</button> <button class="x" data-a="delDay" data-date="${e.date}" data-unit="${e.unitId}" title="Hapus">✕</button></td></tr>`;
 }).join('');

 const tipe=D.extraTipe||'additional';
 const extraForm=unit?`<div class="ubox" style="margin-top:12px">
  <b>Scope of Work Tambahan</b> <span class="note">&nbsp;pekerjaan di luar daftar scope unit ini</span>
  <div class="fgrid" style="margin-top:8px">
   <label class="f">Nama Scope<input list="scopeDL" data-ui="daily.extraName" value="${esc(D.extraName||'')}" placeholder="pilih dari katalog atau ketik"></label>
   <label class="f">Jenis<select data-ui="daily.extraTipe" data-rr="1"><option value="additional" ${tipe==='additional'?'selected':''}>Additional Job</option><option value="planned" ${tipe==='planned'?'selected':''}>Terencana</option></select></label>
   ${tipe==='planned'?`<label class="f">Bobot dlm Unit (%)<input type="number" min="0" max="100" step="any" data-ui="daily.extraBobot" value="${esc(D.extraBobot||'')}"></label>`:''}
  </div>
  <datalist id="scopeDL">${S.scopeCatalog.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <p class="note" style="margin-top:6px">${tipe==='additional'?'<b>Additional Job</b>: pekerjaan tambahan di luar rencana – dicatat capaiannya, tidak mengubah bobot rencana unit.':'<b>Terencana</b>: scope ditambahkan ke rencana kerja unit dengan bobot di atas; pastikan total bobot scope unit tetap 100% (atur di tab Rencana Kerja).'}</p>
  <button class="btn sm pri" style="margin-top:6px" data-a="addExtraScope">+ Tambah Scope ke Unit</button>
 </div>`:'';

 return `<div class="stack">
 <div class="panel">
  ${toolbar('daily',{saveLabel:'Simpan Progress Hari Ini'})}
  <h2>Entry Progress Harian</h2>
  <p class="note">Pilih Area, lalu Unit – daftar Scope of Work unit tsb muncul. Isi % capaian HARI INI (tambahan, bukan kumulatif) pada tiap scope. Menyimpan ulang tanggal &amp; unit yang sama akan menggantikan isian sebelumnya.</p>
  <div class="fgrid" style="margin-top:8px">
   <label class="f">Tanggal<input type="date" data-ui="daily.date" data-rr="1" value="${D.date}"></label>
   <label class="f">Area<select data-ui="daily.areaId" data-num="1" data-rr="1">${areaOpts}</select></label>
   <label class="f">Unit<select data-ui="daily.unitId" data-num="1" data-rr="1">${unitOpts||'<option value="">– belum ada unit –</option>'}</select></label>
   <label class="f">Jam Kerja Hari Ini (jam)<input type="number" min="0" max="24" step="0.5" data-ui="daily.hours" value="${esc(D.hours)}"></label>
  </div>
  ${unit?`<p class="note" style="margin-top:8px">Group: <b>${g?esc(g.name):'belum dipilih (atur di Master Data)'}</b> &nbsp;|&nbsp; Anggota pada ${D.date}: <b>${members.length}</b> orang &nbsp;|&nbsp; Total bobot rencana unit: <b>${fmtPctS(plannedW)}</b></p>`:''}
  ${unit?`<div class="tbl-wrap" style="margin-top:8px"><table class="tbl-edit">
   <thead><tr><th>Scope of Work</th><th class="n">Bobot dlm Unit</th><th class="n">Capaian s.d. Kemarin</th><th class="n">% Capaian Hari Ini</th><th>Capaian Kumulatif</th></tr></thead>
   <tbody>${rows||'<tr><td colspan="5" class="note">Unit ini belum punya scope – susun di tab Rencana Kerja atau tambahkan scope tambahan di bawah.</td></tr>'}</tbody>
   <tfoot><tr class="tot"><td colspan="4" style="text-align:right">Capaian Unit (scope terencana) setelah entry ini</td><td><b id="pvu">${fmtPctS(wsum>0?acc/wsum:0)}</b></td></tr></tfoot>
  </table></div>${extraForm}
  <button class="btn pri" style="margin-top:12px" data-a="saveDaily">Simpan Progress Hari Ini</button>`:'<p class="warnbox" style="margin-top:8px">Belum ada Unit. Tambahkan Area &amp; Unit di tab Master Data.</p>'}
 </div>
 <div class="panel">
  <h2>Riwayat Daily Input</h2>

  <tbody>${hist||'<tr><td colspan="5" class="note">Belum ada entry.</td></tr>'}</tbody></table></div>

 </div>`;
}

function viewLaporan(){
 const m=S.meta,today=todayStr(),target=projTarget();
 const dates=dateRange(m.start,target);
 const planTot=dates.map(d=>cumulativePlanProject(d));
 let lastA=0;const actTot=dates.map(d=>{if(d<=today)lastA=cumulativeActualProject(d);return lastA});
 const chartTotal=lineChartSVG(dates,[{name:'Plan',color:'var(--heat)',points:planTot},{name:'Actual',color:'var(--accent)',points:actTot}]);
 const colors=['#c22f2f','#c8860d','#2c8445','#1f3864','#7030a0','#be4b48'];
 const unitSeries=S.units.map((u,i)=>{
  let last=0;const pts=dates.map(d=>{if(d<=today)last=cumulativeActualUnit(u.id,d);return last});
  return{name:unitLabel(u),color:colors[i%colors.length],points:pts};
 });
 const chartUnit=lineChartSVG(dates,unitSeries);
 const ref=today<=target?today:target;
 const unitTableRows=S.units.map(u=>{
  const act=cumulativeActualUnit(u.id,ref),plan=cumulativePlanUnit(u.id,ref);
  const status=act>=1?'Selesai':act>0?'Berjalan':'Belum Mulai';
  const pill=act>=1?'ok':act>0?'warn':'info';
  return `<tr><td>${esc(unitLabel(u))}</td><td class="n">${fmtPct(act)}</td><td class="n">${fmtPct(plan)}</td><td><span class="pill ${pill}">${status}</span></td></tr>`;
 }).join('');
 return `<div class="stack">
 <div class="panel"><h2>Kurva S – Total Project (Plan vs Actual)</h2><div style="margin-top:10px">${chartTotal}</div></div>

function diffDays(a,b){return daysBetweenInclusive(a,b)-1}
function projMetrics(p){
 return withProject(p,()=>{
  const m=S.meta,reg=p.reg,st=reg.status,today=todayStr(),target=projTarget();
  const asOf=(st==='closed'&&reg.closedAt)?reg.closedAt:today;
  const planPct=cumulativePlanProject(asOf),actPct=cumulativeActualProject(asOf);
  const C=costByUnit(asOf),tot=sumCost(Object.values(C.res));
  const dts=[...S.logs.map(l=>l.date),...S.hours.map(h=>h.date)].sort();
  const actualStart=dts.length?dts[0]:(reg.startedAt||'');
  const hb=Math.max(0,daysBetweenInclusive(m.start,asOf));
  const sisa=diffDays(asOf,target);
  let forecast='-';
  if(actPct>=1)forecast='Selesai';
  else if(actPct>0&&hb>0)forecast=addDaysStr(asOf,Math.round((1-actPct)/(actPct/hb)));
  const R=reportCompute('',asOf);
  const worked=Object.values(R.per).filter(x=>x.dates.size>0).length;
  const delay=(st==='closed'&&reg.closedAt)?diffDays(target,reg.closedAt):null;
  const durAkt=(st==='closed'&&reg.closedAt&&actualStart)?daysBetweenInclusive(actualStart,reg.closedAt):null;
  const budget=+reg.budget||0;
  return{
   id:p.id,no:reg.no||'-',nama:reg.nama||'-',customer:m.customer||'-',lokasi:reg.lokasi||'-',leader:m.leader||'-',status:st,
   start:m.start,durasi:m.durationDays||0,target,
   nArea:S.areas.length,nUnit:S.units.length,
   nScope:S.items.filter(i=>i.tipe!=='additional').length,nAdd:S.items.filter(i=>i.tipe==='additional').length,
   kontrak:+reg.kontrak||0,budget,
   asOf,planPct,actPct,dev:actPct-planPct,hb,sisa,forecast,
   cost:tot,budgetUsed:budget>0?tot.total/budget:null,sisaBudget:budget-tot.total,
   manHours:tot.manHours,worked,
   actualStart,closedAt:reg.closedAt||'',delay,durAkt,
   units:S.units.map(u=>{const a=areaById(u.areaId),g=groupById(u.groupId);return{area:a?a.name:'?',unit:u.name,group:g?g.name:'-',start:u.start||'',finish:u.finish||'',bobot:(a?+a.weight||0:0)*(+u.weight||0),nScope:plannedItemsOf(u.id).length}})
  };
 });
}

  <div><button class="btn pri" style="margin-top:10px" data-a="regAdd">+ Registrasikan Project</button></div>
  <div class="sect" style="margin-top:20px">DAFTAR PROJECT TERDAFTAR</div>
  <div class="tbl-wrap" style="margin-top:10px"><table class="tbl-edit"><thead><tr><th class="n">No</th><th>No Project</th><th>Nama Project</th><th>Customer</th><th>Lokasi</th><th>Leader</th><th>Mulai</th><th class="n">Durasi</th><th>Target Selesai</th><th class="n">Nilai Kontrak</th><th class="n">Budget Biaya</th><th>Status</th><th></th></tr></thead>
  <tbody>${rows}</tbody></table></div>
 </div>
 ${versionsPanel('register','Perubahan Register Project')}
 </div>`;
}

/* ============ view: summary project ============ */
const SUMS=[
 ['plan','Summary Plan','sumPlan',sumPlanModel,'Rencana seluruh project yang diregistrasikan: jadwal, jumlah area/unit/scope, nilai kontrak, dan budget biaya.'],
 ['running','Plan vs Actual – Running','sumRunning',sumRunningModel,'Perbandingan rencana vs capaian aktual project berstatus Running (per hari ini): progress, sisa hari, forecast, serta realisasi biaya terhadap budget.'],
 ['closed','Plan vs Actual – Close','sumClosed',sumClosedModel,'Perbandingan rencana vs aktual project yang sudah ditutup (Close): durasi & tanggal selesai, progress final, dan biaya final terhadap budget.']];
function viewSummary(){
 const cur=SUMS.find(x=>x[0]===UI.sumTab)||SUMS[0];
 const model=cur[3]();
 const saved=DB.summaries.filter(x=>x.kind===cur[2]).map(r=>`<tr><td class="mono">${fmtTs(r.ts)}</td><td>${esc(r.model.scopeLabel||'Semua project')}</td>
  <td style="white-space:nowrap"><button class="btn sm" data-a="exportSum" data-fmt="xlsx" data-i="${r.id}">Excel</button> <button class="btn sm" data-a="exportSum" data-fmt="pdf" data-i="${r.id}">PDF</button> <button class="x" data-a="delSum" data-i="${r.id}">✕</button></td></tr>`).join('');
 return `<div class="stack">
 <div class="panel">
  <div class="row" style="margin-bottom:14px">${SUMS.map(x=>`<button class="btn ${x[0]===cur[0]?'pri':''}" data-a="sumTab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  ${toolbar(cur[2],{saveLabel:'Simpan Summary'})}
  <label class="chip" style="margin-bottom:10px"><input type="checkbox" data-ui="sumAll" data-rr="1" ${UI.sumAll?'checked':''}> Tampilkan semua project (perbandingan lintas project)</label>
  <h2>${cur[1]}${UI.sumAll?' – Semua Project':' – '+esc(activeProj().reg.no||'')}</h2>
  <p class="note">${cur[4]}</p>
 </div>
 ${renderModelHTML(model)}
 <div class="panel"><h2>Summary Tersimpan – ${cur[1]}</h2>
  <p class="note">Tombol Simpan Summary membekukan isi summary saat ini sehingga bisa diunduh kembali sebagai Excel / PDF.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Disimpan</th><th>Cakupan</th><th></th></tr></thead><tbody>${saved||'<tr><td colspan="3" class="note">Belum ada summary tersimpan.</td></tr>'}</tbody></table></div></div>
 </div>`;
}
/* ============ binding data-b (state tersimpan) ============ */
function resolve(path){
 const root=path[0]==='@'?DB:S;if(path[0]==='@')path=path.slice(1);
 const parts=path.split('.');let obj=root;
 for(let i=0;i<parts.length-1;i++){
  const seg=parts[i];
  if(seg.includes(':')){const[arr,idStr]=seg.split(':');obj=obj[arr]&&obj[arr].find(x=>x.id===+idStr)}
  else obj=obj[seg];
  if(obj==null)return{obj:null,key:parts[parts.length-1]};
 }
 return{obj,key:parts[parts.length-1]};
}
function setPath(path,val){
 if(path[0]!=='@'){const parts=path.split('.');
 if(parts.length===1&&parts[0].includes(':')){const[arr,idx]=parts[0].split(':');S[arr][+idx]=val;return}}
 const{obj,key}=resolve(path);if(obj)obj[key]=val;
}
function readValue(el){
 const d=el.dataset;let v=el.value;
 if(el.type==='number'||d.num==='1'||d.pct==='1'){
  v=v===''?0:parseFloat(v);if(isNaN(v))v=0;if(d.pct==='1')v=v/100;
 }
 return v;
}

/* Ketik per huruf: HANYA simpan nilai, TIDAK render ulang (agar fokus tetap).
   Render ulang dilakukan saat field selesai diedit (event change), dengan fokus dikembalikan. */
document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset||{};
 if(d.ui){
  let v=el.type==='checkbox'?el.checked:el.value;if(d.num==='1')v=v===''?null:+v;
  uiSet(d.ui,v);
  if(/^daily\.pcts\.|^daily\.hours$/.test(d.ui))updateDailyPreview();
  return;
 }
 if(d.b){setPath(d.b,readValue(el));save()}
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset||{};
 if(d.actproj){A.switchProject({i:el.value});return}
 if(d.rg){
  const gid=+d.rg,mid=+d.rm,date=UI.groupViewDate[gid]||todayStr();
  const cur=(UI.rosterEdit[gid]||groupMembersAt(gid,date)).slice();const i=cur.indexOf(mid);
  if(el.checked){if(i<0)cur.push(mid)}else if(i>=0)cur.splice(i,1);
  UI.rosterEdit[gid]=cur;renderKeep();return;
 }
 if(d.gvdate){UI.groupViewDate[d.gvdate]=el.value;delete UI.rosterEdit[d.gvdate];renderKeep();return}
 if(d.ui){
  let v=el.type==='checkbox'?el.checked:el.value;if(d.num==='1')v=v===''?null:+v;
  uiSet(d.ui,v);
  if(d.rr==='1')renderKeep();
  return;
 }
 if(d.b){
  setPath(d.b,readValue(el));save();
  scheduleRender(el.tagName==='SELECT'||el.type==='date'?0:250);
 }
});

/* ============ actions (data-a) ============ */
function purgeItems(ids){S.logs=S.logs.filter(l=>!ids.includes(l.itemId));S.items=S.items.filter(it=>!ids.includes(it.id))}
const A={
 tab:d=>{S.tab=d.v;save();render();window.scrollTo(0,0)},
 toggleImport:()=>{const b=$('#importBox');if(b)b.style.display=b.style.display==='none'?'block':'none'},
 exportJson:()=>{
  const txt=JSON.stringify(DB);
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  try{navigator.clipboard&&navigator.clipboard.writeText(txt)}catch(e){}
  document.body.removeChild(ta);toast('JSON proyek disalin ke clipboard');
 },
 importJson:()=>{
  try{
   const raw=JSON.parse($('#jsonbox').value);
   let db=Array.isArray(raw.projects)?normalizeDB(raw):null;
   if(!db){const p=wrapLegacy(raw);if(!p)throw 0;db=normalizeDB({uid,activeId:p.id,projects:[p],versions:{register:[]},summaries:[],savedAt:{}})}
   if(!db)throw 0;
   bootDB(db);render();toast('Data berhasil dimuat ('+db.projects.length+' project)');
  }catch(e){toast('JSON tidak valid')}
 },
 askReset:()=>{
  if(UI.resetArmed){UI.resetArmed=false;bootDB(defaultDB());render();toast('Data contoh awal (3 project) dimuat');return}
  UI.resetArmed=true;render();setTimeout(()=>{if(UI.resetArmed){UI.resetArmed=false;render()}},4000);
 },
 addManpower:()=>{S.manpower.push({id:nid(),name:'Manpower Baru',posisi:'Helper',rateHour:35000});save();render()},
 delManpower:d=>{const mid=+d.i;S.manpower=S.manpower.filter(m=>m.id!==mid);S.roster.forEach(r=>r.members=r.members.filter(id=>id!==mid));save();render()},
 addScope:()=>{S.scopeCatalog.push('Scope Baru');save();render()},
 delScope:d=>{S.scopeCatalog.splice(+d.i,1);save();render()},
 addGroup:()=>{S.groups.push({id:nid(),name:'Group Baru'});save();render()},
 delGroup:d=>{const gid=+d.i;S.groups=S.groups.filter(g=>g.id!==gid);S.roster=S.roster.filter(r=>r.groupId!==gid);S.units.forEach(u=>{if(u.groupId===gid)u.groupId=0});save();render()},
 saveRoster:d=>{
  const gid=+d.g,date=UI.groupViewDate[gid]||todayStr();
  const members=(UI.rosterEdit[gid]||groupMembersAt(gid,date)).slice();
  const ex=S.roster.find(r=>r.groupId===gid&&r.date===date);
  if(ex)ex.members=members;else S.roster.push({id:nid(),groupId:gid,date,members});
  delete UI.rosterEdit[gid];UI.groupViewDate[gid]=date;
  save();render();toast('Anggota group disimpan untuk tanggal '+date);
 },
 delRoster:d=>{S.roster=S.roster.filter(r=>r.id!==+d.i);save();render()},
 addArea:()=>{S.areas.push({id:nid(),name:'Area Baru',weight:0});save();render()},
 delArea:d=>{
  const aid=+d.i,uids=unitsOf(aid).map(u=>u.id);
  purgeItems(S.items.filter(it=>uids.includes(it.unitId)).map(i=>i.id));
  S.hours=S.hours.filter(h=>!uids.includes(h.unitId));S.units=S.units.filter(u=>u.areaId!==aid);S.areas=S.areas.filter(a=>a.id!==aid);save();render();
 },
 addUnitBulk:d=>{
  const areaId=+d.i,f=uiGet('newUnit.'+areaId,{});
  const baseName=(f.name||'').trim()||'Unit Baru';
  const qty=Math.max(1,Math.min(200,parseInt(f.qty||1,10)||1));
  const w=+(1/qty).toFixed(6);
  for(let i=1;i<=qty;i++)S.units.push({id:nid(),areaId,name:qty>1?`${baseName} #${i}`:baseName,weight:w,groupId:0,start:S.meta.start,finish:projTarget()});
  delete UI.newUnit[areaId];save();render();toast(`${qty} unit "${baseName}" ditambahkan`);
 },
 delUnit:d=>{const u_=+d.i;purgeItems(S.items.filter(it=>it.unitId===u_).map(i=>i.id));S.hours=S.hours.filter(h=>h.unitId!==u_);S.units=S.units.filter(u=>u.id!==u_);save();render()},
 addItem:d=>{S.items.push({id:nid(),unitId:+d.i,scope:S.scopeCatalog[0]||'Scope Baru',weight:0,tipe:'planned'});save();render()},
 delItem:d=>{purgeItems([+d.i]);save();render()},
 copyPlan:d=>{
  const to=+d.i,from=+uiGet('rencana.copyFrom.'+to,0);
  if(!from){toast('Pilih unit sumber terlebih dahulu');return}
  const existing=plannedItemsOf(to);
  if(existing.some(it=>S.logs.some(l=>l.itemId===it.id))){toast('Unit ini sudah memiliki progres – salin dibatalkan');return}
  purgeItems(existing.map(i=>i.id));
  plannedItemsOf(from).forEach(it=>S.items.push({id:nid(),unitId:to,scope:it.scope,weight:it.weight,tipe:'planned'}));
  delete UI.rencana.copyFrom[to];save();render();toast('Rencana kerja disalin');
 },
 addExtraScope:()=>{
  dailyEnsure();const D=UI.daily;
  const name=(D.extraName||'').trim();
  if(!D.unitId){toast('Pilih unit terlebih dahulu');return}
  if(!name){toast('Isi nama scope tambahan');return}
  const tipe=D.extraTipe==='planned'?'planned':'additional';
  if(itemsOf(D.unitId).some(it=>it.scope===name&&(it.tipe||'planned')===tipe)){toast('Scope tsb sudah ada pada unit ini');return}
  const bobot=tipe==='planned'?(parseFloat(D.extraBobot)||0)/100:0;
  S.items.push({id:nid(),unitId:D.unitId,scope:name,weight:bobot,tipe,addedOn:D.date});
  D.extraName='';D.extraBobot='';D.loadedKey='';save();render();
  if(tipe==='planned'){const tot=sumWeight(plannedItemsOf(D.unitId));toast(`Scope terencana ditambahkan. Total bobot unit kini ${fmtPctS(tot)}${weightCheck(tot)?'':' – sesuaikan di Rencana Kerja'}`)}
  else toast('Additional Job ditambahkan ke unit');
 },
 saveDaily:()=>{
  dailyEnsure();const D=UI.daily;
  if(!D.unitId||!D.date){toast('Pilih tanggal, area & unit');return false}
  let clipped=false;
  itemsOf(D.unitId).forEach(it=>{
   const v=parseFloat(D.pcts[it.id]);
   S.logs=S.logs.filter(l=>!(l.date===D.date&&l.itemId===it.id));
   if(isNaN(v)||v<=0)return;
   const maxInc=Math.max(0,1-prevCum(it.id,D.date));
   let inc=v/100;if(inc>maxInc+1e-9){inc=maxInc;clipped=true}
   if(inc>0)S.logs.push({id:nid(),date:D.date,itemId:it.id,pct:+inc.toFixed(6)});
  });
  const hrs=parseFloat(D.hours);
  S.hours=S.hours.filter(h=>!(h.date===D.date&&h.unitId===D.unitId));
  if(!isNaN(hrs)&&hrs>0)S.hours.push({id:nid(),date:D.date,unitId:D.unitId,hours:hrs});
  S.savedAt.daily=new Date().toISOString();
  D.loadedKey='';save();render();
  toast(clipped?'Tersimpan (sebagian % dibatasi agar total scope maks 100%)':'Progress hari ini tersimpan');
  return true;
 },
 editDay:d=>{const u=unitById(+d.unit);if(!u)return;const D=UI.daily;D.date=d.date;D.unitId=u.id;D.areaId=u.areaId;D.loadedKey='';render();window.scrollTo(0,0)},
 delDay:d=>{
  const uidn=+d.unit,ids=itemsOf(uidn).map(i=>i.id);
  S.logs=S.logs.filter(l=>!(l.date===d.date&&ids.includes(l.itemId)));
  S.hours=S.hours.filter(h=>!(h.date===d.date&&h.unitId===uidn));
  UI.daily.loadedKey='';save();render();
 },
 addCost:()=>{
  const F=UI.cost,amt=parseFloat(F.amount);
  if(!F.date||isNaN(amt)||amt<=0){toast('Isi tanggal & jumlah biaya');return}
  S.costs.push({id:nid(),date:F.date,kategori:F.kat||KATEGORI[0],ket:(F.ket||'').trim(),amount:amt,alloc:(F.alloc==null||F.alloc==='prorata')?'prorata':+F.alloc});
  F.ket='';F.amount='';save();render();toast('Biaya proyek ditambahkan');
 },
 delCost:d=>{S.costs=S.costs.filter(c=>c.id!==+d.i);save();render()},

 /* ---- Simpan / Save Excel / Save PDF per bagian ---- */
 saveSection:d=>{
  const k=d.k;
  if(k==='daily'){A.saveDaily();return}
  if(k==='master'||k==='rencana'||k==='register'){
   const note=(uiGet(k+'.note','')||'').trim();
   const r=commitVersion(k,note);
   setSavedAt(k);uiSet(k+'.note','');
   save();render();
   toast(r?`Versi v${r.v.n} tersimpan (${r.changes} perubahan dari versi sebelumnya)`:'Tersimpan – tidak ada perubahan sejak versi terakhir');
   return;
  }
  if(k==='report'){
   const model=reportModel(UI.report.from||'',UI.report.to||'');
   S.reports.unshift({id:nid(),ts:new Date().toISOString(),from:UI.report.from||'',to:UI.report.to||'',model});
   if(S.reports.length>12)S.reports.length=12;
   setSavedAt('report');save();render();toast('Report tersimpan');
   return;
  }
  if(k==='sumPlan'||k==='sumRunning'||k==='sumClosed'){
   DB.summaries.unshift({id:nid(),kind:k,ts:new Date().toISOString(),model:MODELS[k]()});
   let n=0;DB.summaries=DB.summaries.filter(x=>x.kind!==k||++n<=10);
   setSavedAt(k);save();render();toast('Summary tersimpan');
  }
 },
 exportXlsx:async d=>{const m=MODELS[d.k]();await saveFile(fname(m.fileBase,'xlsx',m.noCust,m.fileTag),buildXlsx(m),MIME_X)},
 exportPdf:async d=>{const m=MODELS[d.k]();await saveFile(fname(m.fileBase,'pdf',m.noCust,m.fileTag),buildPdf(m),'application/pdf')},
 exportSaved:async d=>{
  const r=S.reports.find(x=>x.id===+d.i);if(!r)return;
  if(d.fmt==='pdf')await saveFile(fname(r.model.fileBase,'pdf'),buildPdf(r.model),'application/pdf');
  else await saveFile(fname(r.model.fileBase,'xlsx'),buildXlsx(r.model),MIME_X);
 },
 delReport:d=>{S.reports=S.reports.filter(r=>r.id!==+d.i);save();render()},

 /* ---- portfolio: register project & summary ---- */
 switchProject:d=>{
  const p=DB.projects.find(x=>x.id===+d.i);if(!p)return;
  const tab=S.tab;DB.activeId=p.id;S=p.data;S.tab=tab;resetProjectUI();save();render();
 },
 sumTab:d=>{UI.sumTab=d.v;render()},
 regAdd:()=>{
  const F=UI.reg,no=(F.no||'').trim();
  if(!no){toast('Isi No Project');return}
  if(DB.projects.some(p=>p.reg.no===no)){toast('No Project sudah terdaftar');return}
  if(!(F.nama||'').trim()&&!(F.customer||'').trim()){toast('Isi nama project atau customer');return}
  const meta={customer:(F.customer||'').trim(),leader:(F.leader||'').trim(),start:F.start||todayStr(),durationDays:Math.max(1,parseInt(F.durasi,10)||1)};
  const data=blankProject(meta,S,F.copy!==false);
  data.tab=S.tab;
  const p={id:nid(),reg:newReg({no,nama:(F.nama||'').trim(),lokasi:(F.lokasi||'').trim(),kontrak:parseFloat(F.kontrak)||0,budget:parseFloat(F.budget)||0,catatan:(F.catatan||'').trim(),status:'registered'}),data};
  DB.projects.push(p);
  withProject(p,ensureVersions);
  UI.reg={};save();render();toast(`Project ${no} diregistrasikan (Registered). Klik "Buka" untuk mengisi Master Data-nya.`);
 },
 projOpen:d=>{A.switchProject(d);S.tab='master';save();render();window.scrollTo(0,0)},
 projStart:d=>{const p=DB.projects.find(x=>x.id===+d.i);if(!p)return;p.reg.status='running';if(!p.reg.startedAt)p.reg.startedAt=todayStr();save();render();toast('Project berstatus Running')},
 projClose:d=>{
  const p=DB.projects.find(x=>x.id===+d.i);if(!p)return;
  p.reg.status='closed';p.reg.closedAt=todayStr();
  const pr=projMetrics(p);save();render();
  toast(pr.actPct<0.999?`Project di-Close dengan progress ${fmtPctS(pr.actPct)} – pastikan sudah sesuai`:'Project di-Close');
 },
 projReopen:d=>{const p=DB.projects.find(x=>x.id===+d.i);if(!p)return;p.reg.status='running';p.reg.closedAt='';save();render();toast('Project dibuka kembali (Running)')},
 projDel:d=>{
  const id=+d.i;
  if(DB.projects.length<=1){toast('Minimal harus ada 1 project');return}
  if(UI.delArmed!==id){UI.delArmed=id;render();setTimeout(()=>{if(UI.delArmed===id){UI.delArmed=null;render()}},4000);return}
  UI.delArmed=null;
  DB.projects=DB.projects.filter(p=>p.id!==id);
  if(DB.activeId===id){const tab=S.tab;DB.activeId=DB.projects[0].id;S=DB.projects[0].data;S.tab=tab;resetProjectUI()}
  save();render();toast('Project dihapus');
 },
 exportSum:async d=>{
  const r=DB.summaries.find(x=>x.id===+d.i);if(!r)return;
  if(d.fmt==='pdf')await saveFile(fname(r.model.fileBase,'pdf',true,r.model.fileTag),buildPdf(r.model),'application/pdf');
  else await saveFile(fname(r.model.fileBase,'xlsx',true,r.model.fileTag),buildXlsx(r.model),MIME_X);
 },
 delSum:d=>{DB.summaries=DB.summaries.filter(r=>r.id!==+d.i);save();render()},
};
document.addEventListener('click',ev=>{
 const a=ev.target.closest('[data-a]');if(!a)return;
 const fn=A[a.dataset.a];if(fn){ev.preventDefault();fn(a.dataset,a)}
});

render();
</script>
