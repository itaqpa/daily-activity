<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Installation Project — AQPA Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
:root{
--bg:#eef1f3;--panel:#ffffff;--ink:#16222b;--muted:#5c6b76;--line:#d4dde1;--soft:#e4ebee;
--accent:#1f3864;--accent-ink:#ffffff;--heat:#9a6500;--heat-soft:#f6e9cd;
--ok:#2c8445;--ok-soft:#dcefe1;--warn:#a86f12;--warn-soft:#f3e6cc;--bad:#c22f2f;--bad-soft:#fbdede;
/* warna peran: siapa yang mengisi sebuah bagian */
--r-admin:#1f3864;--r-admin-soft:#e1e8f3;--r-user:#9a6500;--r-user-soft:#f6e9cd;--r-auto:#3d6f73;--r-auto-soft:#dcebea;
--f-disp:'Oswald','Arial Narrow',Arial,sans-serif;
--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0e1419;--panel:#161f26;--ink:#e4ebef;--muted:#90a0aa;--line:#2a373f;--soft:#1c2730;
--accent:#6f9ad9;--accent-ink:#0b1420;--heat:#e0a847;--heat-soft:#3a2d15;
--ok:#5ec27a;--ok-soft:#163222;--warn:#e1a947;--warn-soft:#3a2d15;--bad:#ff6d6d;--bad-soft:#3a1c1c;
--r-admin:#6f9ad9;--r-admin-soft:#182940;--r-user:#e0a847;--r-user-soft:#3a2d15;--r-auto:#74b3b8;--r-auto-soft:#142f31;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0e1419;--panel:#161f26;--ink:#e4ebef;--muted:#90a0aa;--line:#2a373f;--soft:#1c2730;
--accent:#6f9ad9;--accent-ink:#0b1420;--heat:#e0a847;--heat-soft:#3a2d15;
--ok:#5ec27a;--ok-soft:#163222;--warn:#e1a947;--warn-soft:#3a2d15;--bad:#ff6d6d;--bad-soft:#3a1c1c;
--r-admin:#6f9ad9;--r-admin-soft:#182940;--r-user:#e0a847;--r-user-soft:#3a2d15;--r-auto:#74b3b8;--r-auto-soft:#142f31;
color-scheme:dark}

.wrap{padding-inline:16px;padding-block:0 48px;max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 12px;border-bottom:2px solid var(--ink)}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.brand h1{margin:2px 0 0;font-family:var(--f-disp);font-weight:700;font-size:27px;letter-spacing:.01em;line-height:1.05;text-transform:uppercase}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:600}

/* ---- alur kerja (navigasi utama): Persiapan -> Pelaksanaan -> Hasil ---- */
nav.flow{display:flex;gap:6px;align-items:stretch;overflow-x:auto;margin-block:12px 16px;padding-bottom:2px}
.flow .grp{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:8px;padding:7px 8px 8px;flex:0 0 auto}
.flow .grp.o-admin,.who.o-admin,.panel.o-admin,.lane.o-admin{--rc:var(--r-admin);--rs:var(--r-admin-soft)}
.flow .grp.o-user,.who.o-user,.panel.o-user,.lane.o-user{--rc:var(--r-user);--rs:var(--r-user-soft)}
.flow .grp.o-auto,.who.o-auto,.panel.o-auto,.lane.o-auto{--rc:var(--r-auto);--rs:var(--r-auto-soft)}
.flow .gl{display:flex;align-items:baseline;gap:7px;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-inline:4px}
.flow .gl b{font-family:var(--f-disp);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.flow .gl i{font-style:normal;font-weight:600;color:var(--rc)}
.flow .pg{display:flex;gap:4px}
.flow .pg button{font-family:var(--f-disp);font-size:15px;font-weight:600;letter-spacing:.02em;background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
.flow .pg button:hover{color:var(--ink);background:var(--soft)}
.flow .pg button.on{color:var(--ink);background:var(--rs);border-color:var(--rc)}
.flow .arr{align-self:center;color:var(--muted);font-size:18px;flex:0 0 auto;padding-inline:1px}
.flow .side{margin-left:auto;align-self:flex-end;flex:0 0 auto;padding-left:10px}

.who{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:4px;color:var(--rc);background:var(--rs);border:1px solid var(--rc);white-space:nowrap;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:500 13px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg.role button.on[data-v="admin"]{background:var(--r-admin);color:var(--accent-ink)}
.seg.role button.on[data-v="user"]{background:var(--r-user);color:var(--accent-ink)}
.seg-wrap{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.subtabs button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;padding:7px 12px;cursor:pointer;text-align:left}
.subtabs button small{display:block;font:11px var(--f-mono);color:var(--muted);margin-top:1px}
.subtabs button.on{background:var(--panel);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink);font-weight:600}

.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}
:disabled{cursor:not-allowed!important;opacity:.6}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel.o-admin,.panel.o-user,.panel.o-auto{border-left:4px solid var(--rc)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec-h .row{gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number],input[type=date]{font-family:var(--f-mono);font-size:13px}
input[type=checkbox]{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--panel)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-size:clamp(19px,1.6vw,24px);font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.bad{color:var(--bad);background:var(--bad-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}.pill.info{color:var(--muted)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);font-size:12px}
td.top{vertical-align:top}
tr.tot td{background:var(--soft);font-weight:600}
tr.act td{background:var(--soft)}
.tbl-edit input,.tbl-edit select{padding:4px 6px;font-size:12.5px}
.tbl-edit td{padding:4px 6px}
.note{font-size:12.5px;color:var(--muted)}
p.note{margin:6px 0 0;max-width:95ch}
.warnbox{border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:8px 11px;font-size:12.5px}
.lockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--r-admin);background:var(--r-admin-soft);color:var(--ink);border-radius:6px;padding:9px 12px;margin:0 0 14px;font-size:13px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:10.5px var(--f-mono)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .axis{stroke:var(--muted);stroke-width:1}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
details.acc{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:12px;background:var(--panel)}
details.acc>summary,details.unit>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
details.acc>summary{padding:10px 12px;background:var(--soft);font-family:var(--f-disp);font-weight:600;font-size:16px}
details>summary::-webkit-details-marker{display:none}
details.acc>summary::before,details.unit>summary::before{content:'+';font-family:var(--f-mono);font-weight:600;color:var(--muted);width:12px;flex:0 0 auto}
details[open].acc>summary::before,details[open].unit>summary::before{content:'\2013'}
details.acc>summary>span:first-of-type,details.unit>summary>b{margin-right:auto}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
details.acc .body{padding:12px}
details.unit{border:1px solid var(--line);border-radius:6px;margin-top:8px;background:var(--bg)}
details.unit>summary{padding:8px 10px;font-size:13.5px}
details.unit[open]>summary{border-bottom:1px dashed var(--line)}
details.unit .ub{padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 8px;font-size:12px;background:var(--panel);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:92vw}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.pctbox{display:inline-flex;align-items:center;gap:4px}
.pctbox input{width:84px}
.pctbox>span{color:var(--muted);font-size:12px}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--r-user)}
.bar.ok>i{background:var(--ok)}
.capcell{display:flex;align-items:center;gap:8px;min-width:150px}
.capcell b{font-family:var(--f-mono);font-size:12.5px;min-width:52px;text-align:right}
.ubox{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px;background:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-block;font:600 10.5px var(--f-mono);padding:0 6px;border-radius:4px;border:1px solid var(--r-user);color:var(--r-user);background:var(--r-user-soft);white-space:nowrap}
.d-add{color:var(--ok);font-weight:600}.d-del{color:var(--bad);font-weight:600}.d-chg{color:var(--warn);font-weight:600}
details.ver{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel)}
details.ver>summary{cursor:pointer;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
details.ver .vb{padding:0 10px 10px}
.ctx{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.ctx select{font-weight:600}

/* daftar "yang perlu dilengkapi" & peta pengisian */
.todo{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.todo li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--bg)}
.todo li>span:nth-child(2){flex:1 1 260px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:12px}
.lane{border:1px solid var(--line);border-top:4px solid var(--rc);background:var(--rs);padding:12px 14px;position:relative}
.lane:first-child{border-radius:8px 0 0 8px}.lane:last-child{border-radius:0 8px 8px 0}
.lane+.lane{border-left:0}
.lane h3{color:var(--rc)}
.lane .step{font:600 11.5px var(--f-mono);color:var(--muted)}
.lane ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.lane li{margin:3px 0}
.lane p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
@media (max-width:820px){.lanes{grid-template-columns:minmax(0,1fr)}.lane,.lane:first-child,.lane:last-child{border-radius:0}.lane+.lane{border-left:1px solid var(--line);border-top-width:4px}}
td .who{font-size:10.5px}
</style></head>
<body>
<div id="app"></div>
<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const fmtRp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const fmtPct=(n,d=1)=>((n||0)*100).toFixed(d)+'%';
const fmtPctS=n=>(+(((n||0)*100).toFixed(2)))+'%';
const pctVal=w=>+(((+w||0)*100).toFixed(4));
const fmtNum=(n,d=0)=>(n||0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtTs=ts=>{try{return new Date(ts).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ts}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addDaysStr(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function daysBetweenInclusive(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
function dateRange(a,b){const out=[];if(!a||!b||a>b)return out;let d=a,g=0;while(d<=b&&g<400){out.push(d);d=addDaysStr(d,1);g++}return out}
let toastT;
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',3000)}

/* ============ state ============ */
const DB_KEY='aqpa_installation_project_db_v1';
const OLD_KEYS=['aqpa_installation_project_v4','aqpa_installation_project_v3','aqpa_installation_project_v2'];
const STATUS_LABEL={registered:'Registered',running:'Running',closed:'Closed'};
const PORTFOLIO=['register','sumPlan','sumRunning','sumClosed'];
/* halaman (susunan baru). Tab lama dipetakan sekali lewat OLD_TAB saat data lama dimuat. */
const TAB_KEYS=['register','master','rencana','harian','dash','laporan','peta'];
const OLD_TAB={struktur:'rencana',daily:'harian',report:'laporan',cost:'laporan',summary:'laporan',laporan:'dash'};
const DEFAULT_SCOPES=['Mobilisasi Alat & Material','Marking & Layout','Fabrikasi Support / Bracket','Instalasi Metal Expansion Joint',
 'Pengelasan (Welding)','Pemasangan Anchor / Bolting','Alignment & Leveling','Pressure / Leak Test','Painting & Coating',
 'Inspection & Final Check','Cleaning & Demobilisasi'];
const POSISI=['Leader','Welder','Teknisi','Helper','HSE'];
const KATEGORI=['Akomodasi','Hotel','Transportasi','Consumable'];
let uid=1;
function nid(){return uid++}
function projTarget(){return addDaysStr(S.meta.start,(S.meta.durationDays||1)-1)}

function defaultState(){
 const mp=(name,posisi,rh)=>({id:nid(),name,posisi,rateHour:rh});
 const manpower=[
  mp('Nama Manpower 1','Welder',45000), mp('Nama Manpower 2','Welder',45000),
  mp('Nama Manpower 3','Teknisi',40000), mp('Nama Manpower 4','Teknisi',40000),
  mp('Nama Manpower 5','Helper',32500), mp('Nama Manpower 6','Helper',32500)];
 const grp=name=>({id:nid(),name});
 const groups=[grp('Tim Welding A'),grp('Tim Mekanikal B'),grp('Tim Gabungan')];
 const roster=[
  {id:nid(),groupId:groups[0].id,date:'2026-09-01',members:[manpower[0].id,manpower[1].id,manpower[2].id]},
  {id:nid(),groupId:groups[1].id,date:'2026-09-01',members:[manpower[3].id,manpower[4].id]},
  {id:nid(),groupId:groups[2].id,date:'2026-09-01',members:manpower.map(m=>m.id)}];
 const areas=[{id:nid(),name:'Area 1',weight:.55},{id:nid(),name:'Area 2',weight:.45}];
 const mkUnit=(areaId,name,weight,groupId,start,finish)=>({id:nid(),areaId,name,weight,groupId,start,finish});
 const units=[
  mkUnit(areas[0].id,'Unit 1',.60,groups[0].id,'2026-09-01','2026-09-20'),
  mkUnit(areas[0].id,'Unit 2',.40,groups[1].id,'2026-09-08','2026-09-27'),
  mkUnit(areas[1].id,'Unit 1',.50,groups[2].id,'2026-09-01','2026-09-20'),
  mkUnit(areas[1].id,'Unit 2',.50,groups[0].id,'2026-09-08','2026-09-27')];
 const mkItem=(unitId,scope,weight)=>({id:nid(),unitId,scope,weight,tipe:'planned'});
 const items=[
  mkItem(units[0].id,'Mobilisasi Alat & Material',.08), mkItem(units[0].id,'Marking & Layout',.12),
  mkItem(units[0].id,'Instalasi Metal Expansion Joint',.40), mkItem(units[0].id,'Pengelasan (Welding)',.28),
  mkItem(units[0].id,'Inspection & Final Check',.12),
  mkItem(units[1].id,'Mobilisasi Alat & Material',.10), mkItem(units[1].id,'Instalasi Metal Expansion Joint',.50),
  mkItem(units[1].id,'Pressure / Leak Test',.25), mkItem(units[1].id,'Inspection & Final Check',.15),
  mkItem(units[2].id,'Mobilisasi Alat & Material',.08), mkItem(units[2].id,'Marking & Layout',.12),
  mkItem(units[2].id,'Instalasi Metal Expansion Joint',.40), mkItem(units[2].id,'Pengelasan (Welding)',.28),
  mkItem(units[2].id,'Inspection & Final Check',.12),
  mkItem(units[3].id,'Mobilisasi Alat & Material',.05), mkItem(units[3].id,'Marking & Layout',.10),
  mkItem(units[3].id,'Instalasi Metal Expansion Joint',.35), mkItem(units[3].id,'Pengelasan (Welding)',.20),
  mkItem(units[3].id,'Painting & Coating',.15), mkItem(units[3].id,'Inspection & Final Check',.15)];
 const logs=[
  {id:nid(),date:'2026-09-01',itemId:items[0].id,pct:1},

 });

function costByUnit(upTo){

  const u=unitById(h.unitId);const members=groupMembersAt(u&&u.groupId,h.date);
  const hrs=+h.hours||0;

 });
 const pool={Akomodasi:0,Hotel:0,Transportasi:0,Consumable:0};
 S.costs.filter(c=>c.date<=upTo).forEach(c=>{
  const amt=+c.amount||0;
  if(c.alloc==='prorata'||!res[c.alloc])pool[c.kategori]=(pool[c.kategori]||0)+amt;
  else res[c.alloc][c.kategori]+=amt;
 });
 const ids=S.units.map(u=>u.id);
 const totalMH=ids.reduce((s,id)=>s+res[id].manHours,0);
 let share={};
 if(totalMH>0)ids.forEach(id=>share[id]=res[id].manHours/totalMH);
 else{
  const w={};let tw=0;S.units.forEach(u=>{const a=areaById(u.areaId);w[u.id]=(a?+a.weight||0:0)*(+u.weight||0);tw+=w[u.id]});
  ids.forEach(id=>share[id]=tw>0?w[id]/tw:(ids.length?1/ids.length:0));
 }
 ids.forEach(id=>KATEGORI.forEach(k=>{res[id][k]+=(pool[k]||0)*share[id]}));
 ids.forEach(id=>{const r=res[id];r.total=r.manpower+r.Akomodasi+r.Hotel+r.Transportasi+r.Consumable});
 return{res,pool,totalMH};
}

function reportCompute(from,to){
 const inR=d=>(!from||d>=from)&&(!to||d<=to);
 const per={};S.manpower.forEach(m=>per[m.id]={mp:m,dates:new Set(),hours:0,units:{}});
 const day={};const noGroup=new Set();
 S.hours.forEach(h=>{
  if(!inR(h.date))return;const u=unitById(h.unitId);if(!u)return;const hrs=+h.hours||0;if(hrs<=0)return;
  const mem=groupMembersAt(u.groupId,h.date);if(!mem.length)noGroup.add(u.id);
  (day[h.date]=day[h.date]||{units:{},heads:new Set(),total:0});
  day[h.date].units[u.id]=(day[h.date].units[u.id]||0)+hrs*mem.length;day[h.date].total+=hrs*mem.length;
  mem.forEach(mid=>{
   const p=per[mid];if(!p)return;
   p.dates.add(h.date);p.hours+=hrs;p.units[u.id]=(p.units[u.id]||0)+hrs;day[h.date].heads.add(mid);
  });
 });
 return{per,day,noGroup};
}

function diffDays(a,b){return daysBetweenInclusive(a,b)-1}
function projMetrics(p){
 return withProject(p,()=>{
  const m=S.meta,reg=p.reg,st=reg.status,today=todayStr(),target=projTarget();
  const asOf=(st==='closed'&&reg.closedAt)?reg.closedAt:today;
  const planPct=cumulativePlanProject(asOf),actPct=cumulativeActualProject(asOf);
  const C=costByUnit(asOf),tot=sumCost(Object.values(C.res));
  const dts=[...S.logs.map(l=>l.date),...S.hours.map(h=>h.date)].sort();
  const actualStart=dts.length?dts[0]:(reg.startedAt||'');
  const hb=Math.max(0,daysBetweenInclusive(m.start,asOf));
  const sisa=diffDays(asOf,target);
  let forecast='-';
  if(actPct>=1)forecast='Selesai';
  else if(actPct>0&&hb>0)forecast=addDaysStr(asOf,Math.round((1-actPct)/(actPct/hb)));
  const R=reportCompute('',asOf);
  const worked=Object.values(R.per).filter(x=>x.dates.size>0).length;
  const delay=(st==='closed'&&reg.closedAt)?diffDays(target,reg.closedAt):null;
  const durAkt=(st==='closed'&&reg.closedAt&&actualStart)?daysBetweenInclusive(actualStart,reg.closedAt):null;
  const budget=+reg.budget||0;
  return{
   id:p.id,no:reg.no||'-',nama:reg.nama||'-',customer:m.customer||'-',lokasi:reg.lokasi||'-',leader:m.leader||'-',status:st,
   start:m.start,durasi:m.durationDays||0,target,

   nScope:S.items.filter(i=>i.tipe!=='additional').length,nAdd:S.items.filter(i=>i.tipe==='additional').length,
   kontrak:+reg.kontrak||0,budget,
   asOf,planPct,actPct,dev:actPct-planPct,hb,sisa,forecast,
   cost:tot,budgetUsed:budget>0?tot.total/budget:null,sisaBudget:budget-tot.total,
   manHours:tot.manHours,worked,
   actualStart,closedAt:reg.closedAt||'',delay,durAkt,

 });

/* ============ halaman: Input Harian (User) — satu tanggal kerja untuk progress, anggota group, biaya ============ */
function prevCum(itemId,date){return Math.min(1,S.logs.filter(l=>l.itemId===itemId&&l.date<date).reduce((s,l)=>s+(+l.pct||0),0))}
function dailyLoad(){
 const D=UI.daily;D.pcts={};
 itemsOf(D.unitId).forEach(it=>{const l=S.logs.find(l=>l.date===D.date&&l.itemId===it.id);if(l)D.pcts[it.id]=pctVal(l.pct)});
 const h=S.hours.find(h=>h.date===D.date&&h.unitId===D.unitId);
 D.hours=h?h.hours:8;
}
function dailyEnsure(){
 const D=UI.daily;
 if(!D.date)D.date=todayStr();
 if(!areaById(D.areaId))D.areaId=S.areas[0]?S.areas[0].id:null;
 const u=unitById(D.unitId);
 if(!u||u.areaId!==D.areaId){const us=unitsOf(D.areaId);D.unitId=us[0]?us[0].id:null}
 const key=D.date+'|'+D.unitId;
 if(D.loadedKey!==key){dailyLoad();D.loadedKey=key}
}
function dailyRowCalc(it){
 const D=UI.daily,prev=prevCum(it.id,D.date),v=parseFloat(D.pcts[it.id]);
 const inc=isNaN(v)||v<=0?0:Math.min(v/100,Math.max(0,1-prev));
 return{prev,inc,total:prev+inc};
}
function updateDailyPreview(){
 const D=UI.daily;let wsum=0,acc=0;
 itemsOf(D.unitId).forEach(it=>{
  const c=dailyRowCalc(it);
  if(it.tipe!=='additional'){wsum+=+it.weight||0;acc+=(+it.weight||0)*c.total}
  const t=document.getElementById('pv_'+it.id),b=document.getElementById('pvb_'+it.id);
  if(t)t.textContent=fmtPctS(c.total);if(b)b.style.width=Math.min(100,c.total*100)+'%';
 });
 const u=document.getElementById('pvu');if(u)u.textContent=fmtPctS(wsum>0?acc/wsum:0);
}
function harianProgress(){
 const D=UI.daily;
 const areaOpts=S.areas.map(a=>`<option value="${a.id}" ${a.id===D.areaId?'selected':''}>${esc(a.name)}</option>`).join('');
 const unitOpts=unitsOf(D.areaId).map(u=>`<option value="${u.id}" ${u.id===D.unitId?'selected':''}>${esc(u.name)}</option>`).join('');
 const unit=unitById(D.unitId),items=unit?itemsOf(unit.id):[];
 const g=unit?groupById(unit.groupId):null;
 const members=unit?groupMembersAt(unit.groupId,D.date):[];
 let wsum=0,acc=0;
 const planned=items.filter(i=>i.tipe!=='additional'),extra=items.filter(i=>i.tipe==='additional');
 const rowHtml=it=>{
  const c=dailyRowCalc(it),add=it.tipe==='additional';
  if(!add){wsum+=+it.weight||0;acc+=(+it.weight||0)*c.total}
  const val=D.pcts[it.id];
  return `<tr>
   <td>${esc(it.scope)} ${add?'<span class="badge">Additional job</span>':''}</td>
   <td class="n">${add?'–':fmtPctS(it.weight)}</td>
   <td class="n">${fmtPctS(c.prev)}</td>
   <td class="n"><span class="pctbox"><input type="number" min="0" max="100" step="any" placeholder="0" aria-label="Capaian hari ini ${esc(it.scope)}" data-ui="daily.pcts.${it.id}" value="${val==null?'':esc(val)}"><span>%</span></span></td>
   <td><div class="capcell"><div class="bar" style="flex:1"><i id="pvb_${it.id}" style="width:${Math.min(100,c.total*100)}%"></i></div><b id="pv_${it.id}">${fmtPctS(c.total)}</b></div></td>
  </tr>`;
 };
 const rows=planned.map(rowHtml).join('')+extra.map(rowHtml).join('');
 const keys={};
 S.logs.forEach(l=>{const it=itemById(l.itemId);if(!it)return;const k=l.date+'|'+it.unitId;(keys[k]=keys[k]||{date:l.date,unitId:it.unitId,items:[],hours:0}).items.push({scope:it.scope,pct:l.pct,add:it.tipe==='additional'})});
 S.hours.forEach(h=>{const k=h.date+'|'+h.unitId;(keys[k]=keys[k]||{date:h.date,unitId:h.unitId,items:[],hours:0}).hours+=+h.hours||0});
 const hist=Object.values(keys).sort((a,b)=>b.date.localeCompare(a.date)||a.unitId-b.unitId).map(e=>{
  const u=unitById(e.unitId);
  const chips=e.items.map(x=>`<span class="pill ${x.add?'warn':'info'}" style="margin:1px 3px 1px 0">${esc(x.scope)}${x.add?' (additional)':''} +${fmtPctS(x.pct)}</span>`).join('')||'<span class="note">–</span>';
  return `<tr${e.date===D.date?' class="act"':''}><td class="mono">${e.date}</td><td>${esc(unitLabel(u))}</td><td class="n">${fmtNum(e.hours,1)}</td><td>${chips}</td>
   <td style="white-space:nowrap"><button class="btn sm" data-a="editDay" data-date="${e.date}" data-unit="${e.unitId}">Edit</button> <button class="x" data-a="delDay" data-date="${e.date}" data-unit="${e.unitId}" title="Hapus" aria-label="Hapus entry">✕</button></td></tr>`;
 }).join('');
 const extraForm=unit?`<div class="ubox">
  <b>Additional job</b> <span class="note">&nbsp;pekerjaan di luar scope rencana unit ini. Dicatat capaiannya tanpa mengubah bobot rencana.</span>
  <div class="row" style="margin-top:8px;align-items:flex-end">
   <label class="f" style="flex:1 1 240px;max-width:380px">Nama pekerjaan<input list="scopeDL" data-ui="daily.extraName" value="${esc(D.extraName||'')}" placeholder="pilih dari katalog atau ketik"></label>
   <button class="btn sm" data-a="addExtraScope">Tambahkan ke unit ini</button>
  </div>
  <datalist id="scopeDL">${S.scopeCatalog.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <p class="note">Bila pekerjaannya harus masuk bobot rencana, minta Admin menambahkannya sebagai scope di Rencana Kerja.</p>

function todoList(){
 const out=[],today=todayStr(),st=activeProj().reg.status;
 const add=(owner,text,tab,sub)=>out.push({owner,text,tab,sub});
 if(!S.manpower.length)add('admin','Belum ada manpower.','master');
 if(!S.groups.length)add('admin','Belum ada group kerja.','master');
 if(!S.areas.length)add('admin','Rencana Kerja masih kosong: belum ada area, unit, dan scope.','rencana');
 else{
  const aw=sumWeight(S.areas);
  if(!weightCheck(aw))add('admin',`Total bobot area ${fmtPctS(aw)}, seharusnya 100%.`,'rencana');
  S.areas.forEach(a=>{
   const us=unitsOf(a.id),uw=sumWeight(us);
   if(!us.length)add('admin',`${a.name} belum punya unit.`,'rencana');
   else if(!weightCheck(uw))add('admin',`Total bobot unit di ${a.name} ${fmtPctS(uw)}, seharusnya 100%.`,'rencana');
  });
  const noScope=S.units.filter(u=>!plannedItemsOf(u.id).length);
  const badW=S.units.filter(u=>plannedItemsOf(u.id).length&&!weightCheck(sumWeight(plannedItemsOf(u.id))));
  const noGrp=S.units.filter(u=>!groupById(u.groupId));
  const badDate=S.units.filter(u=>!u.start||!u.finish||u.finish<u.start);
  if(noScope.length)add('admin',`Belum ada scope pada ${someNames(noScope.map(unitLabel))}.`,'rencana');
  if(badW.length)add('admin',`Total bobot scope belum 100% pada ${someNames(badW.map(unitLabel))}.`,'rencana');
  if(noGrp.length)add('admin',`Group pelaksana belum dipilih untuk ${someNames(noGrp.map(unitLabel))}.`,'rencana');
  if(badDate.length)add('admin',`Target start / finish belum benar pada ${someNames(badDate.map(unitLabel))}.`,'rencana');
 }
 if(st==='registered'&&(S.logs.length||S.hours.length))add('admin','Sudah ada input harian, tetapi status project masih Registered.','register');
 const used=[...new Set(S.units.map(u=>u.groupId))].map(groupById).filter(Boolean);
 const empty=used.filter(g=>!groupMembersAt(g.id,today).length);
 if(empty.length)add('user',`Anggota belum diisi untuk ${someNames(empty.map(g=>g.name))}.`,'harian','anggota');
 const R=reportCompute('',today);
 if(R.noGroup.size)add('user',`Ada jam kerja tanpa anggota group (man-hour terhitung 0) pada ${someNames([...R.noGroup].map(id=>unitLabel(unitById(id))))}.`,'harian','anggota');
 if(st==='running'&&S.units.length){
  const dts=[...S.logs.map(l=>l.date),...S.hours.map(h=>h.date)].sort(),last=dts[dts.length-1];
  if(!last)add('user','Belum ada input progress harian.','harian','progress');
  else{const gap=daysBetweenInclusive(last,today)-1;if(gap>1&&cumulativeActualProject(today)<0.9995)add('user',`Input progress terakhir ${last}, ${gap} hari yang lalu.`,'harian','progress')}
 }
 return out;
}
function viewDash(){

 const ref=today<m.start?m.start:(today>target?target:today);
 const actual=cumulativeActualProject(ref),plan=cumulativePlanProject(ref);
 const deviasi=actual-plan;
 const rate=hariBerjalan>0?actual/hariBerjalan:0;
 const forecastDays=rate>0?Math.max(0,1-actual)/rate:null;
 const forecastDate=forecastDays!=null?addDaysStr(today,Math.round(forecastDays)):null;
 const dates=dateRange(m.start,target);
 const planPts=dates.map(d=>cumulativePlanProject(d));
 let lastActual=0;

 /* warna mengikuti peran: Plan = rencana Admin, Actual = isian harian User */
 const chart=lineChartSVG(dates,[{name:'Plan (Rencana Kerja)',color:'var(--r-admin)',points:planPts},{name:'Actual (Input Harian)',color:'var(--r-user)',points:actualPts}]);

 });

  :'<p class="note">Tidak ada yang tertinggal: rencana lengkap dan input harian berjalan.</p>';
 return `<div class="stack">

  <div class="sec-h"><div class="row"><h2>Dashboard</h2>${who('auto')}</div><span class="pill ${deviasi>=-0.0005?'ok':'bad'}">${deviasi>=-0.0005?'On track / ahead':'Delay'}</span></div>
  <p class="note" style="margin-bottom:10px">${esc(activeProj().reg.nama||m.customer)} &nbsp;|&nbsp; mulai <b>${m.start}</b>, durasi <b>${durasi} hari</b>, target selesai <b>${target}</b></p>
  <div class="kpis">

   <div class="kpi"><div class="l">Progress plan</div><div class="v">${fmtPct(plan)}</div><div class="s">rencana s.d. hari ini</div></div>
   <div class="kpi ${deviasi>=-0.0005?'ok':'bad'}"><div class="l">Deviasi</div><div class="v">${deviasi>=0?'+':''}${fmtPct(deviasi)}</div><div class="s">actual - plan</div></div>
   <div class="kpi"><div class="l">Hari berjalan</div><div class="v">${hariBerjalan} / ${durasi}</div><div class="s">sisa ${sisaHari} hari</div></div>

function resolve(path){
 const root=path[0]==='@'?DB:S;if(path[0]==='@')path=path.slice(1);
 const parts=path.split('.');let obj=root;
 for(let i=0;i<parts.length-1;i++){
  const seg=parts[i];
  if(seg.includes(':')){const[arr,idStr]=seg.split(':');obj=obj[arr]&&obj[arr].find(x=>x.id===+idStr)}
  else obj=obj[seg];
  if(obj==null)return{obj:null,key:parts[parts.length-1]};
 }
 return{obj,key:parts[parts.length-1]};
}
function setPath(path,val){
 if(path[0]!=='@'){const parts=path.split('.');
 if(parts.length===1&&parts[0].includes(':')){const[arr,idx]=parts[0].split(':');S[arr][+idx]=val;return}}
 const{obj,key}=resolve(path);if(obj)obj[key]=val;
}
function readValue(el){
 const d=el.dataset;let v=el.value;
 if(el.type==='number'||d.num==='1'||d.pct==='1'){
  v=v===''?0:parseFloat(v);if(isNaN(v))v=0;if(d.pct==='1')v=v/100;
 }
 return v;
}

   Render ulang dilakukan saat field selesai diedit (event change), dengan fokus dikembalikan. */
document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset||{};
 if(d.ui){
  let v=el.type==='checkbox'?el.checked:el.value;if(d.num==='1')v=v===''?null:+v;
  uiSet(d.ui,v);
  if(/^daily\.pcts\.|^daily\.hours$/.test(d.ui))updateDailyPreview();
  return;
 }
 if(d.b&&!locked()){setPath(d.b,readValue(el));save()}
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset||{};
 if(d.actproj){A.switchProject({i:el.value});return}
 if(d.rg){
  const gid=+d.rg,mid=+d.rm,date=UI.daily.date||todayStr();
  const cur=(UI.rosterEdit[gid]||groupMembersAt(gid,date)).slice();const i=cur.indexOf(mid);
  if(el.checked){if(i<0)cur.push(mid)}else if(i>=0)cur.splice(i,1);
  UI.rosterEdit[gid]=cur;renderKeep();return;
 }
 if(d.ui){

  if(d.ui==='daily.date'){if(!v)v=todayStr();UI.rosterEdit={}}
  uiSet(d.ui,v);
  if(d.rr==='1')renderKeep();
  return;
 }
 if(d.b&&!locked()){

 }
});

   const maxInc=Math.max(0,1-prevCum(it.id,D.date));

   if(inc>0)S.logs.push({id:nid(),date:D.date,itemId:it.id,pct:+inc.toFixed(6)});

  p.reg.status='closed';p.reg.closedAt=todayStr();
  const pr=projMetrics(p);save();render();
  toast(pr.actPct<0.999?`Project di-Close dengan progress ${fmtPctS(pr.actPct)}, pastikan sudah sesuai`:'Project di-Close');
 },
 projReopen:d=>{const p=DB.projects.find(x=>x.id===+d.i);if(!p)return;p.reg.status='running';p.reg.closedAt='';save();render();toast('Project dibuka kembali (Running)')},
 projDel:d=>{
  const id=+d.i;
  if(DB.projects.length<=1){toast('Minimal harus ada 1 project');return}
  if(UI.delArmed!==id){UI.delArmed=id;render();setTimeout(()=>{if(UI.delArmed===id){UI.delArmed=null;render()}},4000);return}
  UI.delArmed=null;
  DB.projects=DB.projects.filter(p=>p.id!==id);
  if(DB.activeId===id){const tab=S.tab;DB.activeId=DB.projects[0].id;S=DB.projects[0].data;S.tab=tab;resetProjectUI()}
  save();render();toast('Project dihapus');
 },
 exportSum:async d=>{
  const r=DB.summaries.find(x=>x.id===+d.i);if(!r)return;
  if(d.fmt==='pdf')await saveFile(fname(r.model.fileBase,'pdf',true,r.model.fileTag),buildPdf(r.model),'application/pdf');
  else await saveFile(fname(r.model.fileBase,'xlsx',true,r.model.fileTag),buildXlsx(r.model),MIME_X);
 },
 delSum:d=>{DB.summaries=DB.summaries.filter(r=>r.id!==+d.i);save();render()},
};
document.addEventListener('click',ev=>{
 const a=ev.target.closest('[data-a]');if(!a||a.disabled)return;
 const fn=A[a.dataset.a];if(fn){ev.preventDefault();fn(a.dataset,a)}
});

render();
</script>
</body></html>
